name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Circuit compilation dominates the suite; give it room.
      - run: npm test
        timeout-minutes: 30
      - name: Verify publishable package
        run: |
          npm pack --dry-run
          test -f dist/cli.js
          test -f dist/index.js

      # vk-guard guards itself. examples/counter holds a real zkApp (a
      # SmartContract and a ZkProgram) with its verification keys and row
      # counts committed alongside it. If an o1js upgrade or a change in this
      # repo moves either, this step is what says so.
      - name: Dogfood - check the example project
        run: npm run example:check
        timeout-minutes: 15
