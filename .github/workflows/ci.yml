name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Circuit compilation dominates the suite; give it room.
      - run: npm test
        timeout-minutes: 30
      - name: Verify publishable package
        run: |
          npm pack --dry-run
          test -f dist/cli.js
          test -f dist/index.js
