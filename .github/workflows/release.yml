# Publishes vk-guard to npm when a GitHub Release is published.
#
# Cut a release on GitHub (which creates the matching `vX.Y.Z` tag) and this
# runs the full gate and publishes.
#
# Publishing a Release is the ONLY trigger. There is deliberately no
# `push: tags` trigger: cutting a Release also creates the tag, so both would
# fire and two runs would race to publish the same version, one of them dying
# on "cannot publish over the previously published version".
#
# Auth: uses the NPM_TOKEN repository secret, which must be an npm
# **Automation** token (or a granular token with "Bypass two-factor
# authentication" enabled for publish). A classic read-write token without 2FA
# bypass fails with:
#   403 Two-factor authentication or granular access token with bypass 2fa
#   enabled is required to publish packages.
# Create at https://www.npmjs.com/settings/~/tokens -> Generate New Token ->
# Automation.
#
# If NPM_TOKEN is unset the job falls back to npm Trusted Publishing via OIDC
# (`id-token: write`), which needs a trusted publisher for this repo +
# `release.yml` registered on npmjs.com first, or the upload 401s.
#
# Trusted Publishing is the better long-term setup: nothing long-lived to leak
# or rotate. It could not be used for 0.1.0 because npm only configures it for a
# package that already exists — but vk-guard is published now, so it CAN be
# enabled: register the trusted publisher on npmjs.com, then delete the
# NPM_TOKEN secret and this job switches over on its own.
#
# There is no PyPI job here, unlike o1js-scan's publish.yml: vk-guard is a
# Node/TypeScript package with no Python artifact to build or upload.
#
# To release: bump the version in package.json, update CHANGELOG.md, merge,
# then cut a GitHub Release for tag vX.Y.Z (or push the tag).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and pack the tarball, but do not publish.'
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time per ref. Without this, two runs racing on the same
# version both reach `npm publish`: one wins and the other dies on "cannot
# publish over the previously published version".
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the major version alias tag
      id-token: write # OIDC credential for npm Trusted Publishing
    env:
      # Publishing happens only for a published Release or a version TAG
      # push, both of which run with `github.ref` on the tag. Testing the event
      # name alone would be a latent footgun: a branch trigger added later would
      # silently start publishing from that branch. Checking the ref keeps every
      # guard honest, and is what makes it safe to exercise this workflow from a
      # branch.
      RELEASING: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to move the major alias

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; setup-node still ships npm 10.
      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm --version

      - run: npm ci

      # A release is the last place to discover a regression, so the full gate
      # runs here too: types, build, the real-circuit test suite, and the
      # self-check against examples/counter.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        timeout-minutes: 30
      - run: npm run example:check
        timeout-minutes: 15

      - name: Check the tag matches package.json
        if: env.RELEASING == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$PKG" ]; then
            # Cutting a release does NOT bump package.json. Publishing anyway
            # would ship the wrong version under the right tag, and npm would
            # either take it silently or fail downstream with "you cannot
            # publish over the previously published version" — a symptom several
            # steps from the cause. Name the actual problem here.
            echo "::error::Release tag $TAG but package.json says $PKG."
            echo "::error::Cutting a tag does not bump the version. Fix with:"
            echo "::error::  npm version ${TAG#v} --no-git-tag-version"
            echo "::error::then commit, delete tag $TAG, and re-cut the release."
            exit 1
          fi
          echo "releasing $PKG"
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Verify the package contents
        run: |
          set -euo pipefail
          npm pack --dry-run
          # examples/ and test/ must never ship; the bin must.
          TARBALL="$(npm pack --silent | tail -1)"
          tar -tzf "$TARBALL" > files.txt
          grep -q '^package/dist/cli.js$' files.txt || { echo "::error::dist/cli.js missing from the tarball"; exit 1; }
          if grep -qE '^package/(examples|test)/' files.txt; then
            echo "::error::examples/ or test/ leaked into the published package"
            exit 1
          fi
          rm -f "$TARBALL" files.txt

      - name: Publish to npm
        if: env.RELEASING == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN unset - publishing via OIDC trusted publisher"
            unset NODE_AUTH_TOKEN
            # setup-node always writes always-auth=true plus a ${_authToken}
            # placeholder when registry-url is set. Left in place with no token
            # behind it, npm sends the literal placeholder and fails with a
            # confusing 401 instead of attempting OIDC, so strip it.
            npm config delete //registry.npmjs.org/:_authToken || true
          else
            echo "NPM_TOKEN present - publishing with automation token"
          fi
          npm publish --provenance --access public

      - name: Move the major version tag
        if: env.RELEASING == 'true' && !contains(github.ref_name, '-')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # README and action.yml examples reference `auditinfra-io/vk-guard@v1`,
          # so the major alias has to follow each release.
          MAJOR="v${TAG#v}"
          MAJOR="${MAJOR%%.*}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR" --force
          echo "moved $MAJOR to $GITHUB_SHA"

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### vk-guard release"
            echo ""
            if [ "$RELEASING" = "true" ]; then
              echo "Published \`$TAG\` to npm with provenance."
            else
              echo "Dry run: all checks passed, nothing published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
